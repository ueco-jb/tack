name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            arch: armv6
            target: arm-unknown-linux-musleabihf
            zig: true
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - if: ${{ !matrix.zig }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: ${{ matrix.zig }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - if: ${{ matrix.zig }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - run: cargo ${{ matrix.zig && 'zigbuild' || 'build' }} --release --locked --target "$TARGET" -p tack -p tackd
      - run: |
          mkdir dist
          for bin in tack tackd; do
            cp "target/$TARGET/release/$bin" "dist/$bin-${{ matrix.arch }}-linux"
          done
          file dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.arch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
