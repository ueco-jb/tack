[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/storage", "crates/tack", "crates/tackd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/ueco-jb/tack"

[workspace.dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
tack = { path = "crates/tack" }
tack_core = { path = "crates/core" }
tack_server = { path = "crates/server" }
tack_storage = { path = "crates/storage" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "3", default-features = false, features = ["json"] }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
