[workspace]
resolver = "3"
members = ["crates/core", "crates/storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/ueco-jb/tack"

[workspace.dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
rusqlite = { version = "0.42", features = ["bundled"] }
serde_json = "1"
tack_core = { path = "crates/core" }
tack_server = { path = "crates/server" }
tack_storage = { path = "crates/storage" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
